    if (!r) return; x.strokeStyle = aktif ? ((r.posisi.terbuka || 0) >= 0 ? '#45d483' : '#ff6b5e') : '#1e2a3a'; x.lineWidth = 3; x.beginPath(); let y = 90;
    for (let i = 0; i < 24; i++) { y += Math.sin(i * 1.7 + j + r.urut) * 9 + (aktif ? ((r.posisi.terbuka || 0) >= 0 ? -1.6 : 1.6) : 0); x.lineTo(10 + i * 10, Math.max(20, Math.min(150, y))); } x.stroke();
    x.fillStyle = '#9fb3c8'; x.font = 'bold 20px JetBrains Mono, monospace'; x.fillText(j ? r.simbol.replace('USDT', '') : r.interval, 10, 26); L2.t.needsUpdate = true; }); }

function tempatkanRobot() { let iTunggu = 0, iKeluar = 0; DATA.robot.forEach((r, i) => { let R2 = ROBOT[r.id]; const baru = !R2;
    if (!R2) { const o = buatOrang(WARNA[i % 8]); o.g.userData.robot = r.id; const l = document.createElement('div'); l.className = 'label'; l.onclick = () => bukaPanel(r.id); $('#label').appendChild(l);
      R2 = ROBOT[r.id] = { o, label: l, pos: new THREE.Vector3(MEJA[i].x, 0, MEJA[i].z + 1.8) }; o.g.position.copy(R2.pos); }
    R2.r = r; const meja = MEJA[i];
    if (r.status === 'dikeluarkan') { const [x, z] = KELUAR[iKeluar++ % KELUAR.length]; R2.tujuan = new THREE.Vector3(x, 0, z); R2.mode = 'keluar'; R2.hadap = Math.PI / 2; }
    else if (r.posisi) { R2.tujuan = new THREE.Vector3(meja.x, 0, meja.z); R2.mode = 'duduk'; R2.hadap = 0; }
    else { const [x, z, h, jenis] = TUNGGU[iTunggu++ % TUNGGU.length]; R2.tujuan = new THREE.Vector3(x, 0, z); R2.mode = r.status === 'jeda' ? 'sofa' : jenis; R2.hadap = h; }
    if (baru) { R2.o.g.position.set(R2.tujuan.x, 0, R2.tujuan.z); R2.o.g.rotation.y = R2.hadap ?? 0; }   // saat halaman dibuka langsung di tempatnya, tidak berjalan dulu
    gambarMonitor(meja, r.status === 'dikeluarkan' ? null : r);
    const u = pnlRobot(r), buka = r.posisi ? r.posisi.terbuka || 0 : null;
    R2.label.className = 'label' + (r.status === 'dikeluarkan' ? ' keluar' : ''); R2.ukuran = null;
    R2.label.innerHTML = `<div class="pnl ${(buka ?? u) >= 0 ? 'naik' : 'turun'}">${buka != null ? `${r.posisi.sisi.toUpperCase()} ${usdT(buka)}` : r.status === 'dikeluarkan' ? 'dikeluarkan ' + usdT(u) : r.status === 'jeda' ? 'jeda' : 'menunggu sinyal'}</div><div class="nama">${esc(r.nama)} <i>${esc(r.simbol.replace('USDT', ''))}${r.live ? ' · LIVE' : ''}</i></div>`; }); }

function gambarHud() { const R = DATA.robot, D = dompet(), awal = +D.modal_awal, kini = +D.ekuitas, live = R.some(r => r.live), henti = D.status === 'berhenti';
  $('#hud').innerHTML = `<div class="judul"><b>Lantai Trading</b><small>Binance futures<span class="mode ${live ? 'live' : ''}">${live ? 'ADA UANG SUNGGUHAN' : D.akun === 'demo' ? 'BINANCE DEMO' : 'SIMULASI'}</span></small></div>
    <div><small>Saldo bersama</small><b class="${kini >= awal ? 'naik' : 'turun'}">${usd(kini)}</b></div><div><small>Sejak mulai</small><b class="${kini >= awal ? 'naik' : 'turun'}">${usdT(kini - awal)}</b></div>
    <div><small>Risiko/transaksi</small><b>${usd(+D.risiko_persen * +D.tingkat)}</b></div><div><small>Naik ke ${usd(+D.risiko_persen * +D.tingkat * 3)} di</small><b>${usd(3 * +D.tingkat)}</b></div>
    <div><small>${henti ? 'Rem darurat' : 'Rem darurat di'}</small><b class="${henti ? 'turun' : ''}">${henti ? 'MENYALA' : usd((1 - +D.rem_persen) * +D.tingkat)}</b></div>
    <div><small>Posisi terbuka</small><b>${R.filter(r => r.posisi).length}/${D.maks_posisi}</b></div><div><small>Dikeluarkan</small><b class="${R.some(r => r.status === 'dikeluarkan') ? 'turun' : ''}">${R.filter(r => r.status === 'dikeluarkan').length}</b></div>
    <div><small>Transaksi</small><b>${R.reduce((a, r) => a + (r.statistik?.transaksi || 0), 0)}</b></div>`;
  if (henti) { $('#hud .judul').insertAdjacentHTML('afterend', `<div class="rem"><small>${esc(D.catatan || 'Rem darurat menyala.')}</small><button class="pil utama" id="bLanjutDompet">Nyalakan lagi</button></div>`);
    $('#bLanjutDompet').onclick = async e => { if (prompt(`Semua robot akan trading lagi. Tingkat risiko dihitung ulang dari saldo sekarang ${usd(kini)} (risiko ${usd(+D.risiko_persen * kini)} per transaksi).\n\nKetik YA untuk melanjutkan.`) !== 'YA') return;
      e.target.disabled = true; try { const j = await rpc('lantai_atur', { p_token: token, p_robot: '', p_aksi: 'dompet-lanjut' }); if (!j.ok) throw new Error(j.pesan); await muat(); } catch (x) { alert(x.message); e.target.disabled = false; } }; }
  $('#ket').textContent = `Putaran terakhir ${DATA.terakhir ? jam(DATA.terakhir) : '-'} · tiap 5 menit · geser untuk memutar, ketuk robot untuk rinciannya`; }

function bukaPanel(id) { const R2 = ROBOT[id]; if (!R2) return; const r = R2.r, s = r.statistik || {}, p = r.posisi, m = pnlRobot(r), D = dompet(), risiko = +D.risiko_persen * +D.tingkat, batas = +D.keluar_persen * +D.tingkat, T = DATA.transaksi.filter(t => t.robot === id).slice(0, 8);
  $('#panel').innerHTML = `<h2>${esc(r.nama)} · ${esc(s.judul || r.strategi)}</h2><div class="sub">${esc(r.simbol)} · lilin ${esc(r.interval)} · ${r.live ? '<b style="color:var(--merah)">uang sungguhan</b>' : D.akun === 'demo' ? 'Binance Demo' : 'simulasi'} · status ${esc(r.status)}</div>
    <div class="aturan"><b>Aturan tertulis.</b> ${esc(s.aturan || '-')} Memakai saldo bersama 8 robot (paling banyak ${D.maks_posisi} posisi terbuka sekaligus). Rugi kalau stop loss kena paling besar ${usd(risiko)}; leverage dihitung otomatis supaya harga likuidasi selalu lebih jauh dari stop loss. Dikeluarkan kalau rugi bersih robot ini mencapai ${usd(batas)}.</div>
    <div class="kisi"><div><small>Untung-rugi robot</small><b class="${m >= 0 ? 'naik' : 'turun'}">${usdT(m)}</b></div><div><small>Sisa sebelum dikeluarkan</small><b>${usd(Math.max(0, m + batas))}</b></div><div><small>Untung bersih total</small><b class="${(s.pnl || 0) >= 0 ? 'naik' : 'turun'}">${usdT(s.pnl || 0)}</b></div>
      <div><small>Transaksi</small><b>${s.transaksi || 0}</b></div><div><small>Menang</small><b>${s.transaksi ? Math.round(s.menang / s.transaksi * 100) + '%' : '-'}</b></div><div><small>Harga ${esc(r.simbol.replace('USDT', ''))}</small><b>${harga(s.mark)}</b></div></div>
    ${p ? `<div class="judul-sub">Posisi terbuka</div><div class="baris"><span>${p.sisi.toUpperCase()} ${harga(p.qty)} ${esc(r.simbol.replace('USDT', ''))} di ${harga(p.masuk)}</span><span class="${(p.terbuka || 0) >= 0 ? 'naik' : 'turun'}">${usdT(p.terbuka || 0)}</span></div>
      <div class="baris"><span>Stop loss · take profit${p.rr ? ` (risk:reward 1:${p.rr})` : ''}</span><span>${harga(p.sl)} · ${harga(p.tp)}</span></div><div class="baris"><span>Tempat posisi</span><span>${p.akun === 'demo' ? 'Binance Demo (lihat di demo.binance.com)' : p.akun === 'live' || p.live ? 'Binance, uang sungguhan' : 'dicatat simulasi saja'}</span></div><div class="baris"><span>Leverage · risiko · margin</span><span>${p.leverage || 1}x · ${usd(p.risiko || 0)} · ${usd(p.margin || 0)}</span></div><div class="baris"><span>Alasan masuk</span><span style="font-family:var(--sans);white-space:normal;text-align:right">${esc(p.alasan)}</span></div>` : `<div class="judul-sub">Menunggu sinyal</div><div class="baris"><span>Sinyal terakhir</span><span style="font-family:var(--sans);white-space:normal;text-align:right">${esc(s.terakhirSinyal?.teks || 'belum ada')}</span></div>`}
    ${r.catatan ? `<div class="peringatan">${esc(r.catatan)}</div>` : ''}
    <div class="judul-sub">Transaksi terakhir</div>${T.length ? T.map(t => `<div class="baris"><span>${jam(t.waktuKeluar)} · ${t.sisi.toUpperCase()} · ${esc(t.alasanKeluar)}</span><span class="${t.pnl >= 0 ? 'naik' : 'turun'}">${usdT(t.pnl)}</span></div>`).join('') : '<div class="baris"><span>Belum ada</span><span></span></div>'}
    <div class="aksi">${r.status === 'aktif' ? `<button class="pil" data-aksi="jeda">Jeda</button>` : r.status === 'jeda' ? `<button class="pil utama" data-aksi="lanjut">Lanjutkan</button>` : `<button class="pil utama" data-aksi="mulai-ulang">Mulai ulang (rugi robot kembali $0)</button>`}
      ${r.status !== 'dikeluarkan' ? (r.live ? `<button class="pil" data-aksi="live-mati">Kembali ke simulasi</button>` : `<button class="pil bahaya" data-aksi="live-nyala">Pakai uang sungguhan…</button>`) : ''}<button class="pil" id="bTutup">Tutup</button></div>
    ${!DATA.kunciBursa ? `<div class="sub" style="margin-top:10px">Kunci API Binance belum dipasang. Saklar uang sungguhan baru bekerja setelah kamu sendiri memasang BINANCE_KEY dan BINANCE_SECRET di Supabase → Edge Functions → Secrets.</div>` : ''}`;
  $('#tirai').classList.add('buka'); $('#bTutup').onclick = () => $('#tirai').classList.remove('buka');
  document.querySelectorAll('[data-aksi]').forEach(b => b.onclick = async () => { const a = b.dataset.aksi;
    if (a === 'live-nyala' && prompt(`Robot ${r.nama} akan membuka posisi dengan SALDO SUNGGUHAN di Binance futures (rugi per transaksi sekitar ${usd(risiko)}, leverage dihitung otomatis; rugi bisa lebih besar kalau harga melompat melewati stop loss).\n\nKetik YA untuk melanjutkan.`) !== 'YA') return;
    b.disabled = true; try { const j = await rpc('lantai_atur', { p_token: token, p_robot: id, p_aksi: a }); if (!j.ok) throw new Error(j.pesan); await muat(); bukaPanel(id); } catch (e) { alert(e.message); b.disabled = false; } }); }
$('#tirai').onclick = e => { if (e.target.id === 'tirai') $('#tirai').classList.remove('buka'); };

async function muat() { try { const j = await rpc('lantai_baca', { p_token: token }); if (!j.ok) { location.href = './'; return; } DATA = j; gambarLayar(); tempatkanRobot(); gambarHud(); }
  catch (e) { $('#ket').textContent = 'Gagal memuat: ' + e.message; } }
$('#bMuat').onclick = muat;

// ---------- kamera & interaksi
const kam = { sudut: .35, tinggi: 15, jarak: 26, pusat: new THREE.Vector3(-1, 1, 0) };
const aturKamera = () => { camera.position.set(kam.pusat.x + Math.sin(kam.sudut) * kam.jarak, kam.tinggi, kam.pusat.z + Math.cos(kam.sudut) * kam.jarak); camera.lookAt(kam.pusat); };
const ukur = () => { const hp = innerWidth < 600; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = hp ? 58 : 42; kam.jarak = hp ? 40 : 26; kam.tinggi = hp ? 30 : 15; kam.pusat.x = hp ? 1.5 : -1; kam.sudut = hp ? .15 : .35; camera.updateProjectionMatrix(); aturKamera(); };
addEventListener('resize', ukur); ukur();
let seret = null; const el = renderer.domElement;
el.addEventListener('pointerdown', e => { seret = { x: e.clientX, y: e.clientY, s: kam.sudut, t: kam.tinggi, g: 0 }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => { if (!seret) return; const dx = e.clientX - seret.x, dy = e.clientY - seret.y; seret.g += Math.abs(dx) + Math.abs(dy); kam.sudut = seret.s - dx * .006; kam.tinggi = Math.max(5, Math.min(40, seret.t + dy * .05)); aturKamera(); });
el.addEventListener('pointerup', e => { if (seret && seret.g < 6) { const r = el.getBoundingClientRect(), v = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), ray = new THREE.Raycaster(); ray.setFromCamera(v, camera);
    const hit = ray.intersectObjects(Object.values(ROBOT).map(x => x.o.g), true)[0]; let o = hit?.object; while (o && !o.userData.robot) o = o.parent; if (o) bukaPanel(o.userData.robot); } seret = null; });
el.addEventListener('wheel', e => { kam.jarak = Math.max(12, Math.min(50, kam.jarak + e.deltaY * .02)); aturKamera(); }, { passive: true });

// ---------- animasi: berjalan ke tujuan, duduk mengetik, minum kopi, main biliar, terkulai di luar pintu
const v3 = new THREE.Vector3(); let t0 = performance.now();
function frame(now) { const t = now / 1000, dt = Math.min(.05, (now - t0) / 1000); t0 = now;
  for (const R2 of Object.values(ROBOT)) { const o = R2.o, g = o.g; if (!R2.tujuan) continue; const jarak = Math.hypot(R2.tujuan.x - g.position.x, R2.tujuan.z - g.position.z);
    // pose tujuan tiap mode; anggota badan bergerak halus menuju pose itu (tidak pernah melompat), gerakan diam dibuat pelan
    const T = { y: 0, kk: 0, kn: 0, lk: 0, ln: 0, kepY: 0, kepX: 0, badanX: 0 }, u = R2.r.urut;
    if (jarak > .05) { const arah = new THREE.Vector3(R2.tujuan.x - g.position.x, 0, R2.tujuan.z - g.position.z).normalize(); g.position.addScaledVector(arah, Math.min(jarak, dt * 3.2));
      const sel = Math.atan2(Math.sin(Math.atan2(-arah.x, -arah.z) - g.rotation.y), Math.cos(Math.atan2(-arah.x, -arah.z) - g.rotation.y)); g.rotation.y += sel * Math.min(1, dt * 10);
      const a = Math.sin(t * 9) * .6; T.kk = a; T.kn = -a; T.lk = -a * .7; T.ln = a * .7; }
    else { const sel = Math.atan2(Math.sin((R2.hadap ?? 0) - g.rotation.y), Math.cos((R2.hadap ?? 0) - g.rotation.y)); g.rotation.y += sel * Math.min(1, dt * 6);   // putar lewat sudut terpendek
      const m = R2.mode;
      if (m === 'duduk') { T.y = -.38; T.kk = T.kn = 1.5; T.lk = 1.3 + Math.max(0, Math.sin(t * 3.2 + u)) * .05; T.ln = 1.3 + Math.max(0, Math.sin(t * 3.2 + u + 1.6)) * .05; T.kepY = Math.sin(t * .35 + u) * .18; }
      else if (m === 'sofa') { T.y = -.42; T.kk = T.kn = 1.5; T.lk = T.ln = .3; T.kepX = .3 + Math.sin(t * .8 + u) * .04; }
      else if (m === 'kopi') { const minum = (t * .2 + u * .37) % 1 < .25; T.ln = minum ? 2.2 : .45; T.lk = .15; T.kepY = Math.sin(t * .5 + u) * .3; T.kepX = minum ? -.15 : 0; }
      else if (m === 'biliar') { T.lk = T.ln = .9 + Math.sin(t * 1.4 + u) * .3; T.badanX = .25; }
      else if (m === 'keluar') { T.kepX = .5; } }
    const f = Math.min(1, dt * (jarak > .05 ? 18 : 7)), dekat = (a, b) => a + (b - a) * f;
    g.position.y = dekat(g.position.y, T.y); o.kk.rotation.x = dekat(o.kk.rotation.x, T.kk); o.kn.rotation.x = dekat(o.kn.rotation.x, T.kn); o.lk.rotation.x = dekat(o.lk.rotation.x, T.lk); o.ln.rotation.x = dekat(o.ln.rotation.x, T.ln);
    o.kepala.rotation.y = dekat(o.kepala.rotation.y, T.kepY); o.kepala.rotation.x = dekat(o.kepala.rotation.x, T.kepX); o.badan.rotation.x = dekat(o.badan.rotation.x, T.badanX);
    v3.set(g.position.x, g.position.y + 2.55, g.position.z).project(camera); R2.lx = (v3.x + 1) / 2 * innerWidth; R2.ly = (1 - v3.y) / 2 * innerHeight; R2.lz = v3.z; }
  const L = Object.values(ROBOT).filter(R2 => R2.tujuan), taruh = [];
  for (const R2 of L) R2.ukuran ??= [R2.label.offsetWidth, R2.label.offsetHeight];
  L.sort((a, b) => a.lz - b.lz || a.r.urut - b.r.urut);
  for (const R2 of L) { const [w, h] = R2.ukuran; let y = R2.ly;
    for (let n = 0; n < 8; n++) { const tabrak = taruh.find(q => Math.abs(q.x - R2.lx) < (q.w + w) / 2 + 2 && y > q.y - q.h - 2 && y - h - 2 < q.y); if (!tabrak) break; y = tabrak.y - tabrak.h - 3; }
    taruh.push({ x: R2.lx, y, w, h }); R2.label.style.transform = `translate(${R2.lx}px, ${y}px) translate(-50%,-100%)`; R2.label.style.opacity = R2.lz < 1 ? 1 : 0; }
  renderer.render(scene, camera); requestAnimationFrame(frame); }
if (token) { muat(); setInterval(muat, 20000); requestAnimationFrame(frame); }
</script>
</body>
</html>
