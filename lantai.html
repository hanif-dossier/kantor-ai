const GESTUR = ['Yes', 'No', 'Wave', 'ThumbsUp'];
const v3 = new THREE.Vector3(); let t0 = performance.now();
function frame(now) { const t = now / 1000, dt = Math.min(.05, (now - t0) / 1000); t0 = now;
  if (now - interaksi > 12000) kam.tSudut += dt * .025;
  const fk = Math.min(1, dt * 6); kam.sudut += (kam.tSudut - kam.sudut) * fk; kam.tinggi += (kam.tTinggi - kam.tinggi) * fk; kam.jarak += (kam.tJarak - kam.jarak) * fk; aturKamera();
