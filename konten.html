<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0f14">
<title>Draf Postingan</title>
<!-- Draf postingan Instagram yang disusun Rina (agen sosmed) tiap pagi. Berkasnya di Supabase Storage bucket konten
     (publik): <tanggal>/index.json, slide-01..04.png, keterangan.txt; terbaru.json menunjuk tanggal terakhir.
     Halaman ini hanya menampilkan: pemilik memeriksa, menyalin keterangan, menyimpan gambar, lalu memposting dari HP. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0f14;--panel:#121923;--panel2:#18222e;--garis:rgba(200,215,230,.1);--teks:#eef3f7;--redup:#9fb0c0;--samar:#66788a;--aksen:#f0b35a;--hijau:#6fd39a;--merah:#f28b7d;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.55 var(--sans);min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
a{color:inherit}.wadah{max-width:980px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
header a.kembali{text-decoration:none;color:var(--redup);font-size:13.5px;padding:8px 12px;border:1px solid var(--garis);border-radius:999px}
h1{font:400 34px/1.1 var(--serif);margin:14px 0 4px}h1 i{color:var(--aksen)}
.ket{color:var(--redup);margin:0 0 16px;max-width:64ch}
.pil-baris{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.pil{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--garis);font-size:12.5px;color:var(--redup)}
.pil.aksen{color:var(--aksen);border-color:rgba(240,179,90,.35)}.pil.hijau{color:var(--hijau)}
.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.slide{position:relative;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--garis)}
.slide img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.slide .no{position:absolute;left:10px;top:10px;background:rgba(11,15,20,.7);color:#fff;font-size:12px;padding:4px 9px;border-radius:999px}
.slide a{position:absolute;right:10px;bottom:10px;background:rgba(11,15,20,.75);color:#fff;font-size:12px;padding:6px 10px;border-radius:999px;text-decoration:none}
.label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--samar);font-weight:700}
textarea{width:100%;min-height:260px;margin-top:10px;background:var(--bg);color:var(--teks);border:1px solid var(--garis);border-radius:12px;padding:12px 14px;font:14.5px/1.55 var(--sans);resize:vertical}
.tombol{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--garis);background:var(--panel2);color:var(--teks);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.tombol.utama{background:var(--aksen);color:#1a1206;border-color:var(--aksen)}
.baris-aksi{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sumber{font-size:13px;color:var(--redup);margin-top:12px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.kosong{padding:40px 16px;text-align:center;color:var(--redup)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--hijau);color:#0b2a18;padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.tampil{opacity:1}
@media (max-width:600px){.grid{grid-template-columns:1fr 1fr}h1{font-size:28px}}
.balas-daftar{display:flex;flex-direction:column;gap:8px;margin-top:10px}.balas-item{border:1px solid var(--garis);border-radius:12px;padding:10px 12px;font-size:14px}.balas-atas{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}.balas-atas span{color:var(--redup)}.balas-isi{margin-top:4px}.balas-rina{margin-top:6px;padding-left:10px;border-left:3px solid var(--aksen,#d9a441);color:var(--redup)}
.reel-bungkus{margin-top:10px;display:flex;justify-content:center}.reel-bungkus video{width:100%;max-width:300px;aspect-ratio:9/16;border-radius:14px;background:#000;border:1px solid var(--garis)}
</style>
</head>
<body>
<div class="wadah">
  <header><a class="kembali" href="./">← Kantor AI</a><span class="pil">Rina · social media</span></header>
  <div id="isi"><div class="kosong">Memuat draf…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SB = 'https://hzxfheydtrjhizbwbddh.supabase.co', ANON = 'sb_publishable_3c_5VhfP4Z9g1dSU9c00HQ_0QkuiHTm', DASAR = SB + '/storage/v1/object/public/konten/';
const rpc = async (fn, body) => (await fetch(`${SB}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
const sesiKantor = () => { try { return localStorage.getItem('kantor-sesi'); } catch { return null; } };   // sesi pemilik yang sama dengan Kantor AI (satu alamat)
const LABEL = { draf: ['Draf, belum diposting', ''], tahan: ['Ditahan: tidak akan diposting', 'merah'], posting: ['Sedang diposting', 'aksen'], terbit: ['Terbit di Instagram', 'hijau'], gagal: ['Posting gagal', 'merah'] };
const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const tgl = t => { const d = new Date(t + 'T00:00:00Z'); return `${HARI[d.getUTCDay()]}, ${d.getUTCDate()} ${BLN[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const geser = (t, n) => { const d = new Date(t + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('tampil'); setTimeout(() => e.classList.remove('tampil'), 1800); };
async function muat() {
  const isi = document.getElementById('isi'); let t = new URLSearchParams(location.search).get('t');
  try {
    if (!t) { const r = await fetch(DASAR + 'terbaru.json?x=' + Date.now()); if (!r.ok) throw 0; t = (await r.json()).tanggal; }
    const r = await fetch(`${DASAR}${t}/index.json?x=${Date.now()}`);
    if (!r.ok) { isi.innerHTML = `<h1>Draf <i>postingan</i></h1><div class="kartu kosong">Belum ada draf untuk ${esc(tgl(t))}.<br><br><a class="tombol" href="?t=${geser(t, -1)}">← Hari sebelumnya</a></div>`; return; }
    const D = await r.json(); const S = await rpc('konten_status_baca', { p_tanggal: D.tanggal }).catch(() => ({ status: 'draf' })); D.status = S.status || 'draf'; D.permalink = S.permalink; D.catatan = S.catatan; D.fmt = S.format || D.format || 'carousel'; const adaReel = !!D.reel;
    isi.innerHTML = `
      <h1>Draf <i>postingan</i> ${esc(tgl(D.tanggal))}</h1>
      <p class="ket">Disusun Rina pagi ini dari angka per ${esc(D.tglData)}${D.penulis ? ', kata-kata oleh ' + esc(D.penulis) : ''}. Kalau tidak ditahan, Rina memposting ke Instagram pukul 17.05 WIB. Periksa kalimat dan angkanya dulu; tombol di bawah untuk menahan atau memposting sekarang.</p>
      <div class="pil-baris"><span class="pil aksen">${esc(D.seri)}</span><span class="pil">${esc(D.judul)}</span><span class="pil aksen">${D.fmt === 'reels' && adaReel ? 'Diposting sebagai Reels' : 'Diposting sebagai carousel'}</span><span class="pil">${D.slides.length} slide · 1080×1350${adaReel ? ' · Reels 9:16' : ''}</span>${D.token ? `<span class="pil">${D.token.toLocaleString('id-ID')} token</span>` : ''}<span class="pil ${(LABEL[D.status] || LABEL.draf)[1]}">${(LABEL[D.status] || LABEL.draf)[0]}</span>${D.permalink ? `<a class="pil hijau" href="${esc(D.permalink)}" target="_blank" rel="noopener">Buka di Instagram</a>` : ''}</div>
      ${sesiKantor() ? `<div class="kartu" id="tokenIg" style="margin-bottom:12px"><span class="label">Token Instagram</span><p class="sumber" id="tokenKet" style="margin:6px 0 0">Memeriksa...</p>
        <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--redup);font-size:13.5px">Pasang atau ganti token</summary>
        <p class="sumber">Dari developers.facebook.com, aplikasi Hanif Dossier, menu Instagram, API setup with Instagram login, tombol Generate token. Tempel di sini; nilainya langsung tersimpan ke database dan tidak ditampilkan lagi.</p>
        <div class="baris-aksi"><input id="tokenInput" type="password" placeholder="tempel token di sini" autocomplete="off" style="flex:1;min-width:200px;background:var(--bg);color:var(--teks);border:1px solid var(--garis);border-radius:12px;padding:11px 14px;font:14px var(--sans)"><button class="tombol utama" id="tokenSimpan">Simpan token</button></div></details></div>` : ''}
      ${sesiKantor() ? `<div class="kartu" id="balasIg" style="margin-bottom:12px"><span class="label">Balas komentar dan DM</span><p class="sumber" id="balasKet" style="margin:6px 0 0">Memeriksa...</p><div id="balasDaftar"></div></div>` : ''}
      <div class="kartu" id="kendali" style="margin-bottom:12px"><span class="label">Kendali posting</span>
        ${D.status === 'terbit' ? `<p class="sumber" style="margin:8px 0 0">Sudah terbit${D.diubah ? '' : ''}. Mengubahnya dilakukan dari Instagram.</p>` : sesiKantor() ? `<div class="baris-aksi">${D.status === 'tahan' ? '<button class="tombol" data-status="draf">Lepas tahanan (posting 17.05)</button>' : '<button class="tombol" data-status="tahan">Tahan, jangan diposting</button>'}<button class="tombol utama" data-status="posting">Posting sekarang</button></div><p class="sumber">"Posting sekarang" dijalankan oleh dispatcher di laptop (saat laptop menyala) atau ikut jadwal 17.05 WIB. ${D.catatan ? 'Catatan: ' + esc(D.catatan) : ''}</p>` : `<p class="sumber" style="margin:8px 0 0">Masuk dulu di <a href="./">Kantor AI</a> dengan sandi pemilik untuk menahan atau memposting sekarang. Tanpa tindakan, draf diposting pukul 17.05 WIB.</p>`}</div>
      ${adaReel ? `<div class="kartu" style="margin-bottom:12px"><span class="label">Reels</span><div class="reel-bungkus"><video src="${DASAR}${D.tanggal}/${D.reel}" controls playsinline loop preload="metadata" poster="${DASAR}${D.tanggal}/${D.slides[0]}"></video></div>
        ${D.status !== 'terbit' && sesiKantor() ? `<div class="baris-aksi" id="pilihFormat"><button class="tombol ${D.fmt === 'reels' ? 'utama' : ''}" data-format="reels">Posting sebagai Reels</button><button class="tombol ${D.fmt !== 'reels' ? 'utama' : ''}" data-format="carousel">Posting sebagai carousel</button></div>` : ''}
        <p class="sumber">Slide bergerak 9:16 dengan narasi per slide dan musik lo-fi orisinal buatan Rina (aman dari klaim hak cipta). Bawaannya Reels setiap hari; carousel tidak bisa diberi lagu lewat API. Lagu dari katalog Instagram hanya bisa dipasang manual di aplikasi.</p></div>` : ''}
      <div class="kartu"><span class="label">Slide</span><div class="grid" style="margin-top:10px">${D.slides.map((s, i) => `<div class="slide"><span class="no">${i + 1}</span><img src="${DASAR}${D.tanggal}/${s}" alt="Slide ${i + 1}" loading="lazy"><a href="${DASAR}${D.tanggal}/${s}" target="_blank" rel="noopener">Buka</a></div>`).join('')}</div>
        <p class="sumber">Di HP: buka tiap gambar lalu tahan untuk menyimpan. Urutan unggah mengikuti nomornya.</p></div>
      <div class="kartu" style="margin-top:12px"><span class="label">Keterangan (caption)</span><textarea id="caption" readonly>${esc(D.caption)}</textarea>
        <div class="baris-aksi"><button class="tombol utama" id="salin">Salin keterangan</button><a class="tombol" href="${DASAR}${D.tanggal}/keterangan.txt" target="_blank" rel="noopener">Buka berkas teks</a></div>
        <p class="sumber">Sumber angka: ${esc((D.sumber || []).join(' · '))}.</p></div>
      <div class="nav"><a class="tombol" href="?t=${geser(D.tanggal, -1)}">← ${esc(geser(D.tanggal, -1))}</a><a class="tombol" href="?t=${geser(D.tanggal, 1)}">${esc(geser(D.tanggal, 1))} →</a></div>`;
    document.querySelectorAll('#kendali [data-status]').forEach(b => b.onclick = async () => { const st = b.dataset.status; if (st === 'posting' && !confirm('Posting draf ini ke Instagram sekarang?')) return; if (st === 'tahan' && !confirm('Tahan draf ini? Rina tidak akan mempostingnya hari ini.')) return;
      b.disabled = true; const j = await rpc('konten_status_set', { p_token: sesiKantor(), p_tanggal: D.tanggal, p_status: st }).catch(() => ({ ok: false, pesan: 'Server tidak menjawab.' })); if (!j.ok) { toast(j.pesan || 'Gagal'); b.disabled = false; return; } toast(st === 'tahan' ? 'Draf ditahan' : st === 'posting' ? 'Perintah posting dikirim' : 'Tahanan dilepas'); setTimeout(muat, 600); });
    if (document.getElementById('balasIg')) gambarBalas();
    document.querySelectorAll('#pilihFormat [data-format]').forEach(b => b.onclick = async () => { b.disabled = true; const j = await rpc('konten_format_set', { p_token: sesiKantor(), p_tanggal: D.tanggal, p_format: b.dataset.format }).catch(() => ({ ok: false, pesan: 'Server tidak menjawab.' }));
      if (!j.ok) { toast(j.pesan || 'Gagal'); b.disabled = false; return; } toast(b.dataset.format === 'reels' ? 'Akan diposting sebagai Reels' : 'Akan diposting sebagai carousel'); setTimeout(muat, 500); });
    if (document.getElementById('tokenIg')) { rpc('konten_rahasia_ada', { p_token: sesiKantor(), p_nama: 'ig_token' }).then(j => { document.getElementById('tokenKet').textContent = !j.ok ? j.pesan : j.ada ? `Terpasang (${j.panjang} huruf), terakhir diganti ${new Date(j.diubah).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}. Diperbarui otomatis tiap minggu.` : 'Belum terpasang. Rina belum bisa memposting sampai token diisi.'; }).catch(() => {});
      document.getElementById('tokenSimpan').onclick = async () => { const v = document.getElementById('tokenInput').value.trim(); if (v.length < 20) return toast('Token terlalu pendek'); const b = document.getElementById('tokenSimpan'); b.disabled = true;
        const j = await rpc('konten_rahasia_set', { p_token: sesiKantor(), p_nama: 'ig_token', p_nilai: v }).catch(() => ({ ok: false, pesan: 'Server tidak menjawab.' })); b.disabled = false; if (!j.ok) return toast(j.pesan || 'Gagal'); document.getElementById('tokenInput').value = ''; toast('Token tersimpan'); setTimeout(muat, 500); }; }
    document.getElementById('salin').onclick = async () => { const ta = document.getElementById('caption'); try { await navigator.clipboard.writeText(ta.value); toast('Keterangan disalin'); } catch { ta.select(); document.execCommand('copy'); toast('Keterangan disalin'); } };
  } catch (e) { isi.innerHTML = `<h1>Draf <i>postingan</i></h1><div class="kartu kosong">Belum ada draf yang tersimpan. Rina menyusun draf tiap pagi pukul 07.41 WIB.</div>`; }
}
// Rina membalas komentar dan DM Instagram (6 Okt 2026): database memeriksa tiap 2 menit, kata-kata ditulis Claude.
async function gambarBalas() { const j = await rpc('ig_atur_baca', { p_token: sesiKantor() }).catch(() => ({ ok: false, pesan: 'Server tidak menjawab.' })); const ket = document.getElementById('balasKet'); if (!ket) return;
  if (!j.ok) { ket.textContent = j.pesan || 'Tidak bisa memuat.'; return; }
  const jam = t => t ? new Date(t).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
  ket.innerHTML = `${j.aktif ? '<b style="color:var(--hijau)">Aktif.</b> Rina memeriksa Instagram tiap 2 menit dan membalas komentar serta DM baru dalam sekitar 5 menit.' : '<b>Mati.</b> Komentar dan DM tidak dibalas otomatis.'} Hari ini dibalas: ${j.hariIni}${j.menunggu ? ` · sedang diproses: ${j.menunggu}` : ''} · terakhir periksa ${jam(j.terakhir)}.`
    + `<span class="baris-aksi" style="display:flex;margin-top:8px"><button class="tombol ${j.aktif ? '' : 'utama'}" id="balasTombol">${j.aktif ? 'Matikan balasan otomatis' : 'Nyalakan balasan otomatis'}</button></span>`;
  const LBL = { baru: 'baru masuk', dikirim: 'sedang ditulis', dibalas: 'dibalas', dilewati: 'dilewati', gagal: 'gagal' };
  document.getElementById('balasDaftar').innerHTML = (j.pesan || []).length ? `<div class="balas-daftar">${j.pesan.map(m => `<div class="balas-item"><div class="balas-atas"><b>${m.jenis === 'dm' ? 'DM' : 'Komentar'} @${esc(m.dari || '?')}</b><span>${esc(LBL[m.status] || m.status)} · ${esc(jam(m.waktu))}</span></div>
      <div class="balas-isi">${esc(m.isi || '(gambar atau stiker)')}</div>${m.balasan ? `<div class="balas-rina">Rina: ${esc(m.balasan)}</div>` : ''}${m.catatan ? `<div class="sumber" style="margin:4px 0 0">${esc(m.catatan)}</div>` : ''}</div>`).join('')}</div>`
    : '<p class="sumber">Belum ada komentar atau DM baru sejak balasan otomatis dinyalakan.</p>';
  document.getElementById('balasTombol').onclick = async () => { if (j.aktif && !confirm('Matikan balasan otomatis Rina?')) return; const r = await rpc('ig_atur_set', { p_token: sesiKantor(), p_aktif: !j.aktif }).catch(() => ({ ok: false })); toast(r.ok ? (r.aktif ? 'Balasan otomatis menyala' : 'Balasan otomatis mati') : 'Gagal'); gambarBalas(); }; }
muat();
</script>
</body>
</html>
